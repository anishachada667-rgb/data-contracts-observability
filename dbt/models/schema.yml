version: 2

sources:
  - name: retail_source
    schema: source
    tables:
      - name: orders

models:
  - name: stg_orders
    description: Standardized orders with an enforced output contract.
    columns:
      - name: order_id
        data_type: bigint
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_type: bigint
        data_tests:
          - not_null

      - name: order_status
        data_type: text
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['COMPLETED', 'PROCESSING', 'CANCELLED']

      - name: order_amount
        data_type: numeric(12,2)
        data_tests:
          - not_null

      - name: created_at
        data_type: timestamp with time zone
        data_tests:
          - not_null

      - name: loaded_at
        data_type: timestamp with time zone
        data_tests:
          - not_null

  - name: mart_daily_orders
    description: Daily order counts and amounts by status.