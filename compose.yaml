services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: contract_user
      POSTGRES_PASSWORD: local_demo_password
      POSTGRES_DB: contracts_demo
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract_user -d contracts_demo"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data: